<!DOCTYPE html>
<html>
<head>
<script src="https://glaxyias.github.io/JS/cdn-resilient.js"></script>
<meta charset="utf-8">
<title>Ben 10 Ultimate Alien</title>
<style>body,html{margin:0;height:100%;background:#121212;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Arial;}</style>
</head>
<body>
<div id="game" style="width:100%;height:100%;"></div>
<script>
async function loadGame() {
  const base = "https://cdn.jsdelivr.net/gh/bubbls/ugss@7759113f0ec45c4b7ca6b1c8701dc40d75d5dc3c/Ben%2010%20-%20Ultimate%20Alien%20-%20Cosmic%20Destruction%20(USA)%20(En%2CFr%2CDe%2CEs%2CIt)/Ben%2010%20-%20Ultimate%20Alien%20-%20Cosmic%20Destruction%20(USA)%20(En%2CFr%2CDe%2CEs%2CIt).nds";
  const parts = [base + ".part1", base + ".part2"];
  const buffers = [];
  for (const p of parts) {
    const r = await fetch(p);
    buffers.push(await r.arrayBuffer());
  }
  const blob = new Blob(buffers);
  const url = URL.createObjectURL(blob);
  window.EJS_player = "#game";
  window.EJS_core = "nds";
  window.EJS_gameName = "Ben 10 - Ultimate Alien - Cosmic Destruction";
  window.EJS_color = "#0064ff";
  window.EJS_startOnLoaded = true;
  window.EJS_pathtodata = "https://cdn.jsdelivr.net/gh/genizy/emu@master/";
  window.EJS_gameUrl = url;
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js";
  document.body.appendChild(s);
}
loadGame();
</script>
</body>
</html>
