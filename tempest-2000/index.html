<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempest 2000 (Jaguar)</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
#game { width: 100%; height: 100%; }
#start { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 16px 32px; font-size: 20px; background: #4CAF50; color: #fff; border: none; border-radius: 8px; cursor: pointer; z-index: 10; }
</style>
</head>
<body>
<div id="game"></div>
<button id="start">PLAY Tempest 2000</button>
<script>
(function () {
  var start = document.getElementById('start');
  start.addEventListener('click', function () {
    start.style.display = 'none';
    window.EJS_player = '#game';
    window.EJS_core = 'jaguar';
    window.EJS_color = '#000000';
    window.EJS_startOnLoaded = true;
    window.EJS_pathtodata = '../_shared/emu/';
    window.EJS_gameUrl = 'assets/cdn/99a9ab84-Tempest_2000_World_.zip';
    var s = document.createElement('script');
    s.src = '../_shared/6515c3799bdb-loader.js';
    document.body.appendChild(s);
  });
})();
</script>
</body>
</html>
